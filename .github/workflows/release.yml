name: Release

on:
  push:
    tags:
      - 'v*'
  # Also startable by hand. A tag push can take a long time to produce a run - on 2026-08-26 three
  # of these took 15 to 25 minutes to appear, long enough to look like the push had done nothing -
  # and this gives a way to start a release without deleting and re-pushing a tag, or to retry one
  # that failed halfway.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Without these the build falls back to the debug keystore checked into this repo, whose
      # password is "android" and whose private half is public - the release would go out signed
      # with a key anybody has. Fail loudly instead of shipping that.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set - refusing to build an unsigned release."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/signing.keystore
          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > signing/signing.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      # A release signed with the wrong key cannot be taken back once people have installed it,
      # and gradle prints BUILD SUCCESSFUL whether the APK is signed with the right key, the
      # wrong key or no key at all. So the check asserts the one certificate this app is
      # published under, rather than ruling out the one key it must not be: a "not the debug
      # key" test passes for every other wrong key too, and for an unsigned build.
      - name: Verify the APK is signed with this app's published key
        env:
          EXPECTED_CERT: 702506b2fdc31432d48f315ed873f2f1a6116420cb3508ad14c91b9a2d9ef6d3
        run: |
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          apk_digest=$(echo "$certs" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]+' | awk '{print $NF}')
          if [ -z "$apk_digest" ]; then
            echo "::error::The APK carries no signing certificate - refusing to release it."
            exit 1
          fi
          if [ "$apk_digest" != "$EXPECTED_CERT" ]; then
            echo "::error::APK is signed with $apk_digest, not this app's key ($EXPECTED_CERT)."
            exit 1
          fi

      # Two copies of the same APK go up. The versioned name is what people end up with
      # in their downloads folder and what a checksum quoted anywhere refers to; the
      # unversioned one exists so that
      #   .../releases/latest/download/jimeikin.apk
      # is a link that keeps working after the next release, which a versioned link does
      # not. Both are byte-identical - only the file name differs.
      - name: Rename APK and generate checksum
        run: |
          apk_name="jimeikin-${GITHUB_REF_NAME}.apk"
          apk_path=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk')
          cp "$apk_path" "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"
          cp "$apk_path" jimeikin.apk
          sha256sum jimeikin.apk > jimeikin.apk.sha256

      # The generated notes are a list of commits; they cannot say what someone has to do
      # before installing. This goes above them, and can be emptied once nobody is still
      # upgrading from a build signed with the checked-in key.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # The wildcard does not match the unversioned pair, so it is listed too.
          files: |
            jimeikin-*.apk
            jimeikin-*.apk.sha256
            jimeikin.apk
            jimeikin.apk.sha256
          body_path: .github/release-body.md
          generate_release_notes: true
